name: Supabase Keep-Alive

# ───────────────────────────────────────────────────────────────
# 目的:
#   無料プランの「7日間 DB 無アクティビティで自動一時停止」を回避する。
#   週2回、doctors テーブルを1行だけ SELECT して "DB 活動あり" を成立させる。
#
# 安全性:
#   - anon（publishable）キーのみ使用。SERVICE_KEY は一切使わない。
#   - リポジトリへの書き込み権限なし（permissions: {}）。
#   - URL とキーはハードコードせず GitHub Secrets から読む。
#
# 必要な Secrets（リポジトリ Settings → Secrets and variables → Actions）:
#   SUPABASE_URL       例) https://enprkvbdexsxfbuzhcav.supabase.co
#   SUPABASE_ANON_KEY  USER_UI.html が使っている anon / publishable キー
# ───────────────────────────────────────────────────────────────

on:
  schedule:
    # 毎週 月曜・木曜 00:17 UTC（= 日本時間 09:17 JST）に実行。
    # 月→木=3日 / 木→月=4日 間隔。7日ルールの半分で安全側に倒している。
    # （GitHub の cron は UTC 固定・混雑時に多少ずれるため "0分ちょうど" を避けて 17分にしている）
    - cron: "17 0 * * 1,4"

  # 手動実行ボタン（Actions タブから「Run workflow」でいつでもテスト可能）
  workflow_dispatch:

# リポジトリ操作は一切しないため、付与トークンの権限をすべて剥奪
permissions: {}

# 同時多重起動を防ぐ（手動実行と定期実行が重なっても直列化）
concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping Supabase (doctors を1行SELECT)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Keep-alive request
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          # Secrets 未設定をわかりやすく落とす
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Secrets SUPABASE_URL / SUPABASE_ANON_KEY が未設定です。リポジトリの Settings → Secrets で登録してください。"
            exit 1
          fi

          echo "Pinging ${SUPABASE_URL} (doctors?select=id&limit=1) ..."

          # --fail : HTTP 400 以上ならコマンドを失敗させる → ワークフローが失敗 → GitHub から失敗通知メールが届く
          # -o /dev/null : 本文は捨てる（DB に届けば中身は不要）
          # -w : 成功時に HTTP ステータスをログ出力
          curl --fail --silent --show-error --max-time 30 \
            "${SUPABASE_URL}/rest/v1/doctors?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -o /dev/null \
            -w "Supabase keep-alive OK: HTTP %{http_code}\n"
